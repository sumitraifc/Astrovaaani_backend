<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Astrologer Socket Test</title>

<style>
body {
  font-family: Arial;
  background: #f5f7fb;
  padding: 20px;
}

.card {
  background: #fff;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

input, select, button {
  padding: 10px;
  margin-top: 5px;
  margin-bottom: 10px;
  width: 300px;
}

button {
  background: #2563eb;
  color: white;
  border: none;
  cursor: pointer;
}

pre {
  background: #111827;
  color: #fff;
  padding: 10px;
  overflow: auto;
}
</style>

</head>

<body>

<h2>🔥 Astrologer Socket Debug Panel</h2>

<div class="card">
  <h3>Connection</h3>
  <div id="status">Connecting...</div>
</div>

<div class="card">
  <h3>Astrologer List</h3>
  <button onclick="getList()">GET LIST</button>
  <div id="list"></div>
</div>

<div class="card">
  <h3>Update Online Status</h3>
  <input id="aid1" placeholder="Astrologer ID"/>
  <select id="online">
    <option value="1">Online</option>
    <option value="0">Offline</option>
  </select>
  <button onclick="updateStatus()">Update</button>
</div>

<div class="card">
  <h3>Update Rating</h3>
  <input id="aid2" placeholder="Astrologer ID"/>
  <input id="rating" placeholder="Rating"/>
  <button onclick="updateRating()">Update Rating</button>
</div>

<div class="card">
  <h3>🔥 STEP APPROVAL TEST (NEW)</h3>

  <input id="stepAstroId" placeholder="Astrologer ID"/>

  <select id="step">
    <option value="1">Step 1</option>
    <option value="2">Step 2</option>
    <option value="3">Step 3</option>
    <option value="4">Step 4</option>
    <option value="5">Step 5</option>
  </select>

  <select id="stepStatus">
    <option value="approved">Approved</option>
    <option value="rejected">Rejected</option>
    <option value="pending">Pending</option>
  </select>

  <input id="remark" placeholder="Remark (optional)"/>

  <button onclick="updateStep()">Update Step Status</button>
</div>

<div class="card">
  <h3>📡 Event Log</h3>
  <div id="log"></div>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>
const socket = io("http://localhost:5000");

const log = (title, data) => {
  const div = document.createElement("div");
  div.innerHTML = `
    <h4>${title}</h4>
    <pre>${JSON.stringify(data, null, 2)}</pre>
  `;
  document.getElementById("log").prepend(div);
};

socket.on("connect", () => {
  document.getElementById("status").innerText = "Connected: " + socket.id;
  log("CONNECTED", { id: socket.id });
});

/* LIST */
socket.on("astrologer:list_updated", (data) => {
  log("LIST RESPONSE", data);

  if (data.data) {
    document.getElementById("list").innerHTML =
      data.data.map(a => `
        <div>
          <b>${a.name}</b> (ID: ${a.id})<br>
          Step1: ${a.step1_status} | Step2: ${a.step2_status}<br>
          Step3: ${a.step3_status} | Step4: ${a.step4_status}<br>
          Step5: ${a.step5_status}<br>
          Approval: ${a.approval_status}
          <hr>
        </div>
      `).join("");
  }
});

/* SINGLE UPDATE */
socket.on("astrologer:single_updated", (data) => {
  log("SINGLE UPDATE", data);
});

/* LIST REQUEST */
function getList() {
  socket.emit("astrologer:get_list");
  log("EMIT", { event: "astrologer:get_list" });
}

/* ONLINE */
function updateStatus() {
  socket.emit("astrologer:update_status", {
    astrologer_id: Number(document.getElementById("aid1").value),
    is_online: Number(document.getElementById("online").value)
  });

  log("EMIT", { event: "update_status" });
}

/* RATING */
function updateRating() {
  socket.emit("astrologer:update_rating", {
    astrologer_id: Number(document.getElementById("aid2").value),
    rating: Number(document.getElementById("rating").value)
  });

  log("EMIT", { event: "update_rating" });
}

/* STEP UPDATE */
function updateStep() {
  socket.emit("astrologer:update_step_status", {
    astrologer_id: Number(document.getElementById("stepAstroId").value),
    step: Number(document.getElementById("step").value),
    status: document.getElementById("stepStatus").value,
    remark: document.getElementById("remark").value
  });

  log("EMIT", {
    event: "astrologer:update_step_status"
  });
}

</script>

</body>
</html>
