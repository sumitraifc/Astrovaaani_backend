<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agora Call Test</title>

  <style>
    body { font-family: Arial; background:#f3f4f6; padding:20px; }
    .panel { background:#fff; padding:15px; border-radius:10px; margin-bottom:15px; }
    input, select, button { width:100%; padding:10px; margin:6px 0; }
    button { background:#2563eb; color:#fff; border:none; cursor:pointer; }
    #log { background:#111; color:#0f0; padding:10px; height:250px; overflow:auto; }
  </style>
</head>

<body>

<h2>🔥 Agora Socket Call Test (FIXED)</h2>

<div class="panel">
  <h3>Connect</h3>
  <input id="serverUrl" value="http://localhost:5000"/>
  <button onclick="connectSocket()">Connect</button>
</div>

<div class="panel">
  <h3>Register (IMPORTANT FIX)</h3>

  <input id="regId" type="number" value="1"/>
  
  <select id="regRole">
    <option value="user">User</option>
    <option value="astrologer">Astrologer</option>
  </select>

  <button onclick="register()">Register</button>
</div>

<div class="panel">
  <h3>Call</h3>

  <input id="callerId" type="number" value="1"/>
  <input id="astrologerId" type="number" value="2"/>

  <select id="callType">
    <option value="audio">Audio</option>
    <option value="video">Video</option>
  </select>

  <button onclick="initiateCall()">Call Start</button>
</div>

<div class="panel">
  <h3>Response</h3>

  <input id="callId" placeholder="call_id"/>

  <input id="userId" type="number" value="1"/>
  <input id="astroId" type="number" value="2"/>

  <button onclick="acceptCall()">Accept</button>
  <button onclick="declineCall()">Decline</button>
  <button onclick="endCall()">End</button>
</div>

<div class="panel">
  <h3>Logs</h3>
  <div id="log"></div>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>
let socket;
let currentCall = null;

// CONNECT
function connectSocket() {
  const url = document.getElementById("serverUrl").value;

  socket = io(url, { transports: ["websocket"] });

  socket.on("connect", () => {
    log("CONNECTED: " + socket.id);
  });

  socket.on("call-initiated", d => log("CALL INITIATED: " + JSON.stringify(d)));
  socket.on("call-requested", d => {
    log("CALL REQUESTED: " + JSON.stringify(d));
    currentCall = d.data;
    document.getElementById("callId").value = d.data.call_id;
  });

  socket.on("call-failed", d => log("CALL FAILED: " + JSON.stringify(d)));
  socket.on("call-accepted", d => log("CALL ACCEPTED"));
  socket.on("call-declined", d => log("CALL DECLINED"));
  socket.on("call-ended", d => log("CALL ENDED"));
}

// ✅ FIXED REGISTER
function register() {
  const id = Number(document.getElementById("regId").value);
  const role = document.getElementById("regRole").value;

  socket.emit("register", {
    user_id: id,
    role: role
  });

  log("REGISTER SENT => " + JSON.stringify({ user_id: id, role }));
}

// CALL INITIATE
function initiateCall() {
  const data = {
    user_id: Number(document.getElementById("callerId").value),
    astrologer_id: Number(document.getElementById("astrologerId").value),
    call_type: document.getElementById("callType").value,
    user_details: { name: "User" },
    astrologer_details: { name: "Astrologer" }
  };

  socket.emit("call-initiate", data);
  log("CALL INITIATE => " + JSON.stringify(data));
}

// ACCEPT
function acceptCall() {
  socket.emit("call-accepted", {
    call_id: document.getElementById("callId").value,
    user_id: Number(document.getElementById("userId").value),
    astrologer_id: Number(document.getElementById("astroId").value)
  });
}

// DECLINE
function declineCall() {
  socket.emit("call-declined", {
    call_id: document.getElementById("callId").value,
    user_id: Number(document.getElementById("userId").value),
    astrologer_id: Number(document.getElementById("astroId").value)
  });
}

// END
function endCall() {
  socket.emit("call-ended", {
    call_id: document.getElementById("callId").value,
    user_id: Number(document.getElementById("userId").value),
    astrologer_id: Number(document.getElementById("astroId").value)
  });
}

// LOG
function log(msg) {
  document.getElementById("log").innerHTML =
    new Date().toLocaleTimeString() + " - " + msg + "<br>" +
    document.getElementById("log").innerHTML;
}
</script>

</body>
</html>
