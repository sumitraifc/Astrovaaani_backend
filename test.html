<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<title>Astrologer Chat List Test</title>

<style>

body{
    font-family:Arial;
    background:#f3f4f6;
    padding:20px;
}

button{
    padding:10px 20px;
    border:none;
    background:#2563eb;
    color:#fff;
    border-radius:6px;
    cursor:pointer;
}

.chat-item{
    background:#fff;
    border-radius:10px;
    padding:12px;
    margin-bottom:10px;
    display:flex;
    gap:12px;
    align-items:center;
    border:1px solid #ddd;
}

.chat-item img{
    width:60px;
    height:60px;
    border-radius:50%;
    object-fit:cover;
}

.chat-content{
    flex:1;
}

.name{
    font-size:18px;
    font-weight:bold;
}

.last-message{
    color:#666;
    margin-top:4px;
}

.time{
    font-size:12px;
    color:#999;
}

.unread{
    background:red;
    color:white;
    width:25px;
    height:25px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
}

.online{
    color:green;
}

.offline{
    color:gray;
}

#logs{
    background:black;
    color:#00ff00;
    padding:10px;
    margin-top:20px;
    height:250px;
    overflow:auto;
    font-size:12px;
}

</style>

</head>

<body>

<h2>Astrologer Chat List</h2>

<label>Astrologer ID :</label>

<input
    id="astrologerId"
    value="12"
/>

<button onclick="loadChats()">
    Load Chats
</button>

<hr>

<div id="chatList"></div>

<h3>Socket Logs</h3>

<div id="logs"></div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>

function log(message){

    console.log(message);

    document.getElementById("logs")
        .innerHTML += message + "<br>";

}

/**
 * SOCKET CONNECT
 */
const socket = io(
    "http://localhost:5000",
    {
        transports:["websocket"]
    }
);

socket.on("connect",()=>{

    log("✅ SOCKET CONNECTED");
    log("Socket ID : " + socket.id);

});

socket.on("disconnect",(reason)=>{

    log("❌ SOCKET DISCONNECTED");
    log(reason);

});

socket.on("connect_error",(err)=>{

    log("❌ CONNECT ERROR");
    log(err.message);

});

/**
 * FORMAT TIME
 */
function formatTime(dateString){

    if(!dateString){
        return "";
    }

    return new Date(
        dateString
    ).toLocaleString();

}

/**
 * LOAD CHAT LIST
 */
function loadChats(){

    const astrologer_id =
        Number(
            document.getElementById(
                "astrologerId"
            ).value
        );

    log("--------------------------------");
    log("LOAD CHATS CLICKED");
    log("Astrologer ID : " + astrologer_id);
    log("Socket Connected : " + socket.connected);

    socket.emit(

        "astrologer_chat_list",

        {
            astrologer_id
        },

        (response)=>{

            log("SERVER RESPONSE");
            log(
                JSON.stringify(
                    response,
                    null,
                    2
                )
            );

            const container =
                document.getElementById(
                    "chatList"
                );

            container.innerHTML = "";

            if(!response){

                container.innerHTML =
                    "<h3>No Response</h3>";

                return;
            }

            if(!response.success){

                container.innerHTML =
                    "<h3>" +
                    response.message +
                    "</h3>";

                return;
            }

            if(
                response.data.length === 0
            ){

                container.innerHTML =
                    "<h3>No Chats Found</h3>";

                return;
            }

            response.data.forEach(chat=>{

                const image =
                    chat.profile_image ||
                    "https://ui-avatars.com/api/?name=" +
                    encodeURIComponent(
                        chat.user_name
                    );

                const html = `

                <div class="chat-item">

                    <img
                        src="${image}"
                    >

                    <div class="chat-content">

                        <div class="name">
                            ${chat.user_name}
                        </div>

                        <div class="last-message">
                            ${
                                chat.last_message ||
                                "No Message"
                            }
                        </div>

                        <div class="time">
                            ${
                                formatTime(
                                    chat.message_time
                                )
                            }
                        </div>

                        <div>
                            ${
                                Number(
                                    chat.is_user_online
                                ) === 1
                                ?
                                '<span class="online">🟢 Online</span>'
                                :
                                '<span class="offline">⚫ Offline</span>'
                            }
                        </div>

                        <small>
                            Conversation :
                            ${chat.conversation_id}
                        </small>

                    </div>

                    ${
                        Number(
                            chat.unread_count
                        ) > 0

                        ?

                        `<div class="unread">
                            ${chat.unread_count}
                        </div>`

                        :

                        ""
                    }

                </div>

                `;

                container.insertAdjacentHTML(
                    "beforeend",
                    html
                );

            });

        }

    );

}

</script>

</body>
</html>
