<!DOCTYPE html>
<html>

<head>

  <title>Advanced Realtime Chat Test</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial;
      padding:20px;
      background:#f3f4f6;
    }

    h2,h3{
      margin-bottom:10px;
    }

    input,
    button,
    select{
      padding:10px;
      margin:5px;
      border-radius:6px;
      border:1px solid #ccc;
    }

    button{
      cursor:pointer;
      background:#2563eb;
      color:#fff;
      border:none;
    }

    button:hover{
      opacity:.9;
    }

    button:disabled{
      background:#94a3b8;
      cursor:not-allowed;
    }

    #chat{
      background:#fff;
      padding:15px;
      border-radius:10px;
      height:500px;
      overflow:auto;
      list-style:none;
      border:1px solid #ddd;
      margin-top:10px;
    }

    li{
      margin-bottom:12px;
      padding:12px;
      border-radius:10px;
      word-break:break-word;
    }

    .system{
      background:#dbeafe;
    }

    .user{
      background:#dcfce7;
    }

    .astrologer{
      background:#fce7f3;
    }

    .typing{
      color:orange;
      font-style:italic;
      margin-top:10px;
    }

    img{
      border-radius:10px;
      margin-top:8px;
      max-width:250px;
    }

    .top-box{
      background:#fff;
      padding:15px;
      border-radius:10px;
      margin-bottom:20px;
      border:1px solid #ddd;
    }

    .status-box{
      margin-top:10px;
      font-weight:bold;
    }

    .online{
      color:green;
    }

    .busy{
      color:red;
    }

    .offline{
      color:gray;
    }

  </style>

  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

<h2>Realtime Socket Chat Test</h2>

<div class="top-box">

  <h3>Create Conversation</h3>

  <label>User ID:</label>

  <input
    id="userId"
    value="1"
  />

  <label>Astrologer ID:</label>

  <input
    id="astrologerId"
    value="2"
  />

  <button
    id="createBtn"
    type="button"
  >
    Start Chat
  </button>

</div>

<div class="top-box">

  <h3>Conversation</h3>

  <label>Conversation ID:</label>

  <input
    id="conversationId"
    style="width:320px"
  />

  <button type="button" id="joinBtn">
    Join Room
  </button>

  <button type="button" id="leaveBtn">
    Leave Room
  </button>

  <div
    class="status-box"
    id="astroStatus"
  >
    ⚫ Offline
  </div>

  <div
    class="status-box"
    id="walletStatus"
  >
    Wallet : ₹0
  </div>

</div>

<div class="top-box">

  <h3>Send Message</h3>

  <select id="senderType">

    <option value="user">
      User
    </option>

    <option value="astrologer">
      Astrologer
    </option>

  </select>

  <input
    id="msg"
    placeholder="Type message..."
    style="width:300px"
  />

  <button
    id="sendBtn"
    type="button"
  >
    Send
  </button>

  <br><br>

  <label>Send Image/File:</label>

  <input
    type="file"
    id="fileInput"
  />

  <button type="button" id="uploadBtn">
    Upload
  </button>

</div>

<div class="top-box">

  <h3>Status</h3>

  <div
    id="typing"
    class="typing"
  ></div>

  <ul id="chat"></ul>

</div>

<script src="/test.js"></script>

</body>
</html>
