<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Astrologer Chat List Test</title>
<style>
body{
    font-family:Arial;
    background:#f3f4f6;
    padding:20px;
}
button{
    padding:10px 20px;
    border:none;
    background:#2563eb;
    color:#fff;
    border-radius:6px;
    cursor:pointer;
}
.chat-item{
    background:#fff;
    border-radius:10px;
    padding:12px;
    margin-bottom:10px;
    display:flex;
    gap:12px;
    align-items:center;
    border:1px solid #ddd;
}
.chat-item img{
    width:60px;
    height:60px;
    border-radius:50%;
    object-fit:cover;
}
.chat-content{
    flex:1;
}
.name{
    font-size:18px;
    font-weight:bold;
}
.last-message{
    color:#666;
    margin-top:4px;
}
.time{
    font-size:12px;
    color:#999;
}
.unread{
    background:red;
    color:white;
    width:25px;
    height:25px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
}
.online{ color:green; }
.offline{ color:gray; }
#logs{
    background:black;
    color:#00ff00;
    padding:10px;
    margin-top:20px;
    height:250px;
    overflow:auto;
    font-size:12px;
}
</style>
</head>
<body>
<h2>Astrologer Chat List</h2>
<label>Astrologer ID :</label>
<input id="astrologerId" value="12"/>
<button id="loadChatsBtn" type="button">Load Chats</button>
<hr>
<div id="chatList"></div>
<h3>Socket Logs</h3>
<div id="logs"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/test-chat-list.js"></script>
</body>
</html>
