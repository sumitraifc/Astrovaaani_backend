<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<title>Astrologer Chat List Test</title>

<style>

body{
    font-family:Arial;
    background:#f3f4f6;
    padding:20px;
}

button{
    padding:10px 20px;
    border:none;
    background:#2563eb;
    color:#fff;
    border-radius:6px;
    cursor:pointer;
}

.chat-item{
    background:#fff;
    border-radius:10px;
    padding:12px;
    margin-bottom:10px;
    display:flex;
    gap:12px;
    align-items:center;
    border:1px solid #ddd;
}

.chat-item img{
    width:60px;
    height:60px;
    border-radius:50%;
    object-fit:cover;
}

.chat-content{
    flex:1;
}

.name{
    font-size:18px;
    font-weight:bold;
}

.last-message{
    color:#666;
    margin-top:4px;
}

.time{
    font-size:12px;
    color:#999;
}

.unread{
    background:red;
    color:white;
    width:25px;
    height:25px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
}

.online{ color:green; }
.offline{ color:gray; }

#logs{
    background:black;
    color:#00ff00;
    padding:10px;
    margin-top:20px;
    height:250px;
    overflow:auto;
    font-size:12px;
}

</style>

</head>

<body>

<h2>Astrologer Chat List</h2>

<label>Astrologer ID :</label>

<input id="astrologerId" value="12"/>

<button onclick="loadChats()">Load Chats</button>

<hr>

<div id="chatList"></div>

<h3>Socket Logs</h3>
<div id="logs"></div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>

function log(msg){
    console.log(msg);
    document.getElementById("logs").innerHTML += msg + "<br>";
}

/**
 * SOCKET CONNECT
 */
const socket = io("http://localhost:5000", {
    transports: ["websocket"]
});

socket.on("connect", () => {
    log("✅ SOCKET CONNECTED");
    log("Socket ID : " + socket.id);
});

socket.on("disconnect", (reason) => {
    log("❌ DISCONNECTED : " + reason);
});

socket.on("connect_error", (err) => {
    log("❌ CONNECT ERROR : " + err.message);
});

/**
 * EXTRA DEBUG EVENTS
 */
socket.on("receive_message", (data) => {
    log("💬 NEW MESSAGE: " + JSON.stringify(data));
});

socket.on("wallet_updated", (data) => {
    log("💰 WALLET UPDATE: " + JSON.stringify(data));
});

socket.on("chat_ended", (data) => {
    log("🚫 CHAT ENDED: " + JSON.stringify(data));
});

/**
 * FORMAT TIME
 */
function formatTime(dateString){
    if(!dateString) return "";
    return new Date(dateString).toLocaleString();
}

/**
 * RENDER CHAT LIST
 */
function renderChats(data){

    const container = document.getElementById("chatList");
    container.innerHTML = "";

    data.forEach(chat => {

        const image = chat.profile_image
            ? chat.profile_image
            : "https://ui-avatars.com/api/?name=" + encodeURIComponent(chat.user_name);

        container.innerHTML += `
            <div class="chat-item">

                <img src="${image}" />

                <div class="chat-content">

                    <div class="name">${chat.user_name}</div>

                    <div class="last-message">
                        ${chat.last_message || "No Message"}
                    </div>

                    <div class="time">
                        ${formatTime(chat.message_time)}
                    </div>

                    <div>
                        ${chat.is_user_online == 1
                            ? '<span class="online">🟢 Online</span>'
                            : '<span class="offline">⚫ Offline</span>'
                        }
                    </div>

                    <small>${chat.conversation_id}</small>

                </div>

                ${
                    chat.unread_count > 0
                    ? `<div class="unread">${chat.unread_count}</div>`
                    : ""
                }

            </div>
        `;
    });
}

/**
 * LOAD CHAT LIST (FIXED + DEBUGGED)
 */
function loadChats(){

    const astrologer_id = Number(
        document.getElementById("astrologerId").value
    );

    log("--------------------------------");
    log("🚀 LOAD CHATS CLICKED");
    log("Astrologer ID : " + astrologer_id);
    log("Socket Connected : " + socket.connected);

    console.log("🚀 EMIT BEFORE SEND");

    socket.emit(
        "astrologer_chat_list",
        { astrologer_id },

        (response) => {

            console.log("🔥 CALLBACK RECEIVED:", response);
            log("SERVER RESPONSE RECEIVED");

            if(!response){
                log("❌ No response from server");
                return;
            }

            if(!response.success){
                log("❌ ERROR: " + response.message);
                return;
            }

            log("🔥 TOTAL CHATS: " + response.total);

            renderChats(response.data);
        }
    );

    console.log("🚀 EMIT AFTER SEND");
}

</script>

</body>
</html>
