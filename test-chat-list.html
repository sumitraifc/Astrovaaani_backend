<!DOCTYPE html>
<html>
<head>
  <title>Socket Chat Test</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>

<body>
  <h2>Socket Chat Tester</h2>

  <hr>

  <h3>Astrologer Chat List</h3>

  <input id="astroId" placeholder="Astrologer ID" />
  <button onclick="getChatList()">Get Chat List</button>

  <pre id="list"></pre>

  <hr>

  <h3>Join Chat Room</h3>

  <input id="conversationId" placeholder="Conversation ID" />
  <button onclick="joinRoom()">Join Room</button>

  <hr>

  <h3>Send Message</h3>

  <input id="msg" placeholder="Message" />
  <button onclick="sendMsg()">Send</button>

  <hr>

  <h3>Logs</h3>
  <pre id="log"></pre>

  <script>
    const socket = io("http://localhost:5000"); // change port if needed

    function log(msg) {
      document.getElementById("log").innerText += msg + "\n";
    }

    socket.on("connect", () => {
      log("Connected Socket ID: " + socket.id);
    });

    socket.on("receive_message", (data) => {
      log("New Message: " + JSON.stringify(data));
    });

    socket.on("wallet_updated", (data) => {
      log("Wallet Update: " + JSON.stringify(data));
    });

    socket.on("chat_ended", (data) => {
      log("Chat Ended: " + JSON.stringify(data));
    });

    function getChatList() {
      const astrologer_id = document.getElementById("astroId").value;

      socket.emit(
        "astrologer_chat_list",
        { astrologer_id },
        (res) => {
          document.getElementById("list").innerText =
            JSON.stringify(res, null, 2);

          log("Chat List Received");
        }
      );
    }

    function joinRoom() {
      const conversation_id =
        document.getElementById("conversationId").value;

      socket.emit("join_room", {
        conversation_id,
        sender_type: "astrologer"
      });

      log("Joined Room: " + conversation_id);
    }

    function sendMsg() {
      const conversation_id =
        document.getElementById("conversationId").value;

      const message =
        document.getElementById("msg").value;

      socket.emit("send_message", {
        conversation_id,
        sender_type: "astrologer",
        sender_id: 1,
        message,
        message_type: "text"
      });

      log("Message Sent: " + message);
    }
  </script>
</body>
</html>
