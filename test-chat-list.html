<!DOCTYPE html>
<html>
<head>
    <title>Astrologer Chat List Test</title>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        body{
            font-family: Arial;
            padding:20px;
        }

        .chat{
            border:1px solid #ddd;
            padding:10px;
            margin-bottom:10px;
            border-radius:8px;
        }

        .unread{
            color:red;
            font-weight:bold;
        }

        img{
            width:50px;
            height:50px;
            border-radius:50%;
            object-fit:cover;
        }
    </style>
</head>
<body>

<h2>Astrologer Chat List</h2>

<button onclick="loadChats()">
    Load Chat List
</button>

<hr>

<div id="chatList"></div>

<script>

const socket = io("http://localhost:5000");

socket.on("connect", () => {
    console.log("Connected:", socket.id);
});

socket.on("disconnect", () => {
    console.log("Disconnected");
});

function loadChats(){

    socket.emit(
        "astrologer_chat_list",
        {
            astrologer_id: 12
        },
        (response) => {

            console.log(response);

            const container =
                document.getElementById("chatList");

            container.innerHTML = "";

            if(!response.success){
                container.innerHTML =
                    "<h3>"+response.message+"</h3>";
                return;
            }

            response.data.forEach(chat => {

                const div =
                    document.createElement("div");

                div.className = "chat";

                div.innerHTML = `

                    <img
                        src="${chat.profile_image || 'https://via.placeholder.com/50'}"
                    />

                    <h3>
                        ${chat.user_name}
                    </h3>

                    <p>
                        <b>Conversation:</b>
                        ${chat.conversation_id}
                    </p>

                    <p>
                        <b>Last Message:</b>
                        ${chat.last_message || ''}
                    </p>

                    <p>
                        <b>Message Time:</b>
                        ${chat.message_time || ''}
                    </p>

                    <p>
                        <b>User Status:</b>
                        ${
                            Number(chat.is_user_online) === 1
                            ? '🟢 Online'
                            : '⚫ Offline'
                        }
                    </p>

                    <p class="unread">
                        Unread:
                        ${chat.unread_count}
                    </p>

                `;

                container.appendChild(div);

            });

        }
    );
}

</script>

</body>
</html>
